<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Brand gradient: brand-700 → brand-900 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <!-- Subtle radial glow -->
    <radialGradient id="glow" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <!-- Drop shadow for PDF icon -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative circles (top-right) -->
  <circle cx="1100" cy="80"  r="180" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="1050" cy="160" r="110" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Decorative circles (bottom-left) -->
  <circle cx="100" cy="580" r="160" fill="#ffffff" fill-opacity="0.04"/>

  <!-- PDF document icon (left side) -->
  <g transform="translate(88, 155)" filter="url(#shadow)">
    <!-- Document body -->
    <rect x="0" y="0" width="148" height="188" rx="12" fill="#ffffff"/>
    <!-- Folded corner -->
    <polygon points="106,0 148,42 106,42" fill="#dbeafe"/>
    <polygon points="106,0 148,42 106,0" fill="#93c5fd"/>
    <!-- Text lines -->
    <rect x="20" y="68"  width="90" height="8"  rx="4" fill="#1d4ed8" fill-opacity="0.25"/>
    <rect x="20" y="86"  width="108" height="8" rx="4" fill="#1d4ed8" fill-opacity="0.18"/>
    <rect x="20" y="104" width="72"  height="8" rx="4" fill="#1d4ed8" fill-opacity="0.18"/>
    <rect x="20" y="128" width="108" height="8" rx="4" fill="#1d4ed8" fill-opacity="0.13"/>
    <rect x="20" y="146" width="90"  height="8" rx="4" fill="#1d4ed8" fill-opacity="0.13"/>
    <!-- PDF badge -->
    <rect x="16" y="158" width="52" height="20" rx="6" fill="#1d4ed8"/>
    <text x="42" y="172" font-family="Arial, sans-serif" font-size="11" font-weight="700"
          fill="#ffffff" text-anchor="middle" letter-spacing="1">PDF</text>
    <!-- Pencil / edit icon overlay -->
    <g transform="translate(96, 148)">
      <rect x="0" y="0" width="40" height="40" rx="20" fill="#2563eb"/>
      <line x1="13" y1="26" x2="22" y2="17" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="22" y1="17" x2="27" y2="13" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="13" y1="26" x2="11" y2="29" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Main heading -->
  <text x="300" y="230"
        font-family="'Arial Black', Arial, sans-serif"
        font-size="72"
        font-weight="900"
        fill="#ffffff"
        letter-spacing="-1">
    Free PDF Editor
  </text>

  <!-- Subheading -->
  <text x="300" y="295"
        font-family="Arial, sans-serif"
        font-size="32"
        fill="#bfdbfe"
        letter-spacing="0">
    Edit, Sign &amp; Annotate PDFs Online
  </text>

  <!-- Three pillars -->
  <g transform="translate(300, 360)">
    <!-- Pill 1: No Upload -->
    <rect x="0"   y="0" width="196" height="52" rx="26" fill="#ffffff" fill-opacity="0.12"/>
    <text x="98"  y="32" font-family="Arial, sans-serif" font-size="22" font-weight="700"
          fill="#ffffff" text-anchor="middle">🔒 No Upload</text>

    <!-- Pill 2: 100% Free -->
    <rect x="216" y="0" width="196" height="52" rx="26" fill="#ffffff" fill-opacity="0.12"/>
    <text x="314" y="32" font-family="Arial, sans-serif" font-size="22" font-weight="700"
          fill="#ffffff" text-anchor="middle">✓ 100% Free</text>

    <!-- Pill 3: No Sign-Up -->
    <rect x="432" y="0" width="220" height="52" rx="26" fill="#ffffff" fill-opacity="0.12"/>
    <text x="542" y="32" font-family="Arial, sans-serif" font-size="22" font-weight="700"
          fill="#ffffff" text-anchor="middle">⚡ No Sign-Up</text>
  </g>

  <!-- Divider -->
  <line x1="300" y1="454" x2="1112" y2="454" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Site URL -->
  <text x="300" y="496"
        font-family="Arial, sans-serif"
        font-size="24"
        fill="#93c5fd"
        letter-spacing="0.5">
    pdfeditor.lumicore-labs.com
  </text>

  <!-- LumiCore brand mark (bottom-right) -->
  <text x="1112" y="496"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="600"
        fill="#ffffff"
        fill-opacity="0.5"
        text-anchor="end">
    LumiCore Labs
  </text>
</svg>
